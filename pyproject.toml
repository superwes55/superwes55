[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretscope"
version = "0.1.0"
description = "Passive CLI scanner for externally exposed secrets in web applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "superwes55" }]
keywords = ["security", "secrets", "scanning", "recon", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer[all]>=0.12",
    "playwright>=1.44",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.scripts]
secretscope = "secretscope.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.hatch.build]
include = [
    "/src/**/*.py",
    "/src/**/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secretscope"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/secretscope"]
branch = true

[tool.coverage.report]
fail_under = 80
