rules:
  - id: azure_storage_connection_string
    name: Azure Storage Connection String
    pattern: '(DefaultEndpointsProtocol=https?;AccountName=[^;]{3,24};AccountKey=[A-Za-z0-9+/]{80,}={0,2}[^;\s"''`]*)'
    severity: critical
    description: >
      Azure Storage connection string containing an account key. Grants full
      read/write access to blob, queue, table, and file storage.
    tags: [azure, storage, credentials]

  - id: azure_storage_account_key
    name: Azure Storage Account Key
    pattern: '(?i)(?:AccountKey|StorageKey|storage[_\-]?(?:account[_\-]?)?key)\s*[=:]\s*["\x27]?([A-Za-z0-9+/]{86}==)'
    entropy_threshold: 5.0
    severity: critical
    description: >
      Azure Storage Account access key (512-bit, base64-encoded). Grants
      unrestricted access to the storage account.
    tags: [azure, storage, credentials]

  - id: azure_sas_token
    name: Azure Shared Access Signature Token
    pattern: '((?:sv|sig)=[A-Za-z0-9%+/=&\-]{8,}&(?:[a-z]{1,3}=[A-Za-z0-9%+/=&\-.]*&?){3,})'
    severity: high
    description: >
      Azure SAS token granting scoped, time-limited access to storage resources.
      Scope depends on configured permissions (read, write, delete, list).
    tags: [azure, storage, sas]

  - id: azure_subscription_id
    name: Azure Subscription ID
    pattern: '(?i)subscription[_\-]?[Ii][Dd]\s*[=:"''`\s]+([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
    severity: low
    description: >
      Azure Subscription ID. Low risk alone — it's not a credential — but
      useful for mapping the target's cloud footprint.
    tags: [azure, subscription]
